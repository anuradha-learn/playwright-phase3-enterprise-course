name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      tags:
        description: 'Test tags to run(eg. @smoke @regression)'
        required: false
        default: '@smoke'
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    strategy: 
      matrix: 
        shardIndex: [1, 2] 
        shardTotal: [2] 
      max-parallel: 2
    steps:
    - uses: actions/checkout@v4
    - name: Build Docker image
      run: docker build -t qa-cart-playwright-tests .
    - name: Run tests in container
      run: |
       docker run --rm --init --ipc=host \
         -e BASE_URL=${{ secrets.BASE_URL }} \
         -e API_BASE_URL=${{ secrets.API_BASE_URL }} \
         -e WC_BASE_URL=${{ secrets.WC_BASE_URL }} \
         -e WC_CONSUMER_KEY=${{ secrets.WC_CONSUMER_KEY }} \
         -e WC_CONSUMER_SECRET=${{ secrets.WC_CONSUMER_SECRET }} \
         -e TEST_USER_1_EMAIL=${{ secrets.TEST_USER_1_EMAIL }} \
         -e TEST_USER_1_PASSWORD=${{ secrets.TEST_USER_1_PASSWORD }} \
         -e TEST_USER_2_EMAIL=${{ secrets.TEST_USER_2_EMAIL }} \
         -e TEST_USER_2_PASSWORD=${{ secrets.TEST_USER_2_PASSWORD }} \
         -e TEST_USER_3_EMAIL=${{ secrets.TEST_USER_3_EMAIL }} \
         -e TEST_USER_3_PASSWORD=${{ secrets.TEST_USER_3_PASSWORD }} \
         -e TEST_USER_4_EMAIL=${{ secrets.TEST_USER_4_EMAIL }} \
         -e TEST_USER_4_PASSWORD=${{ secrets.TEST_USER_4_PASSWORD }} \
         -v "$(pwd)/blob-report:/app/blob-report" \
         -v "$(pwd)/allure-results:/app/allure-results" \
         -v "$(pwd)/test-results:/app/test-results" \
         qa-cart-playwright-tests --project=chromium --project=firefox --project=webkit --workers=4 --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
    - name: Upload blob report
      uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: blob-report-${{matrix.shardIndex}}
        path: blob-report
        retention-days: 30
    - name: Upload allure-result
      uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: allure-results-${{matrix.shardIndex}}
        path: allure-results
        retention-days: 30
    - name: Upload Test Results
      uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: test-results-${{matrix.shardIndex}}
        path: test-results/
        retention-days: 30
  merge-reports:
    needs: test
    runs-on: ubuntu-latest
    if: ${{ !cancelled() }}
    steps: 
      - uses: actions/checkout@v4
      - name: merge blob reports
        uses: actions/download-artifact@v4
        with:
          pattern: blob-report-*
          merge-multiple: true
          path: all-blob-reports
      - run: npx playwright merge-reports --reporter=html ./all-blob-reports
      - name: Upload merged HTML report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
         name: playwright-report
         path: playwright-report/
         retention-days: 30
      - name: combine allure-results
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          merge-multiple: true
          path: allure-results
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - run: npm install -g allure-commandline
      - run: allure generate allure-results --clean -o allure-report
      - name: Upload merged Allure report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
         name: allure-report
         path: allure-report/
         retention-days: 30

